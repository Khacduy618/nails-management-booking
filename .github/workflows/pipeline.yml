name: Database Migration & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để chạy tay
    inputs:
      run_seed:
        description: '🌱 Chạy seed dữ liệu vào database? (XÓA TOÀN BỘ DỮ LIỆU CŨ)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # JOB 1: KIỂM TRA XEM CÓ THAY ĐỔI CƠ SỞ DỮ LIỆU KHÔNG
  changes:
    name: Check Database Changes
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for database changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'drizzle/**'
              - 'scripts/migrate.ts'

  # JOB 2: CHẠY MIGRATION (CHỈ CHẠY KHI CÓ THAY ĐỔI HOẶC CHẠY THỦ CÔNG)
  migrate:
    name: Run Database Migration
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle Migrate
        run: pnpm db:migrate

  # JOB 3: SEED DATABASE (CHỈ CHẠY KHI ĐƯỢC BẬT THỦ CÔNG)
  seed:
    name: Seed Database (One-time)
    needs: migrate
    runs-on: ubuntu-latest
    # Chỉ chạy khi người dùng bấm "Run workflow" VÀ chọn run_seed = true
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed == 'true' }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚠️ Seed Database (XÓA và tạo lại dữ liệu mẫu)
        run: pnpm db:seed

  # JOB 4: TRIGGER DEPLOY (CHẠY KHI MIGRATE THÀNH CÔNG HOẶC ĐƯỢC BỎ QUA)
  deploy:
    name: Trigger Vercel Deploy
    needs: [changes, migrate]
    # Chỉ deploy nếu Job migrate thành công HOẶC Job migrate bị bỏ qua (không có thay đổi database)
    if: |
      always() &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    
    steps:
      - name: Call Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
