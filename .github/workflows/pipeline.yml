name: Database Migration & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để chạy tay

jobs:
  # JOB 1: CHẠY MIGRATION
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle Migrate
        # Drizzle-kit sẽ tự kiểm tra, nếu không có thay đổi file .sql 
        # hoặc schema thì nó sẽ báo "No changes" và kết thúc rất nhanh.
        run: pnpm db:migrate

  # JOB 2: TRIGGER DEPLOY (CHỈ CHẠY KHI JOB 1 XONG)
  deploy:
    name: Trigger Vercel Deploy
    needs: migrate # QUAN TRỌNG: Bắt buộc job migrate phải thành công mới chạy tiếp
    runs-on: ubuntu-latest
    
    steps:
      - name: Call Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"