name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # Khớp với bản pnpm v10 bạn đang dùng

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Khuyên dùng bản LTS để ổn định trên CI
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint check
        run: pnpm run lint # Đảm bảo code đúng format

      - name: Run Unit Tests (Vitest)
        run: pnpm run test # Chạy các bài test bạn đã viết

      - name: Build Project
        run: pnpm run build # Thử build xem có lỗi biên dịch không
        env:
          # Thêm các biến môi trường cần thiết để build (nếu có)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}